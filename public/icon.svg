<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Tarkov Toolkit">
  <!-- Full-bleed background keeps the icon safe under maskable (circle/squircle) cropping. -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <g fill="none" stroke="#5eead4" stroke-width="14" stroke-linecap="round">
    <!-- Reticle ring -->
    <circle cx="256" cy="256" r="150"/>
    <!-- Crosshair ticks -->
    <line x1="256" y1="60"  x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="452"/>
    <line x1="60"  y1="256" x2="150" y2="256"/>
    <line x1="362" y1="256" x2="452" y2="256"/>
  </g>
  <circle cx="256" cy="256" r="16" fill="#5eead4"/>
</svg>
